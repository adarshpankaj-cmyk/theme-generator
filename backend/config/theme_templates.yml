# Template Registry — the deterministic core (F1).
#
# The 9 CSS templates are stable boilerplate; the only per-theme variables are
# the artwork images, tint hex, opacity, and which invoice strips get tinted.
# Selector lists here are VERBATIM (order matters) from the reference theme at
# ~/Downloads/Themes/ganesh/css/<template>/latest.css — the ground truth the
# golden test (F3) asserts against. See backend/SPEC.md §3.
#
# `layout` is a cosmetic, unconfirmed best-inference label ([NEED: confirm]
# against internal invoice layout names); it does not affect output.
#
# canvas: a4 (portrait) or a5 (landscape). theme_four and theme_six are the A5
# templates; the rest are A4.

theme_luxury:
  canvas: a4
  layout: luxury
  default_opacity: 0.6
  selectors:
    - ".items-table-header"
    - ".tax-table-header"
    - ".items-table-total"
    - ".items-table-total-foreign"

