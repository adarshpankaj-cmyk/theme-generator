# Layer-1 readability guardrail (F2). Wraps the user's theme prompt in a fixed
# "invoice-safe" template before sending it to the image model. Editable config;
# see backend/SPEC.md §6.1. Substitutions: {{USER_PROMPT}}, {{ORIENTATION}}.
guardrail: |
  Create a refined background watermark illustration for a business invoice, on the theme: "{{USER_PROMPT}}".

  SUBJECT (this is the point — do not reduce it to an abstract pattern):
  - If the theme names a subject — a deity, figure, animal, object, or icon (e.g. Ganesh, a diya, a peacock) — depict THAT subject as the clear, recognizable CENTRAL hero of the image, rendered softly and elegantly. The center region is usually a text heavy region so make sure its that soft.
  - Only if the theme is purely an abstract mood, use a single cohesive ornamental motif instead.
  - Exactly one strong idea. Absolutely NO text, letters, numbers, or written characters anywhere.

  READABILITY (kept legible by PALENESS, not empty space):
  - Render the whole image pale, soft, and low-contrast — like a faint watermark on cream/off-white paper (roughly 20–35% color strength).
  - No dark, dense, or high-contrast areas, especially through the vertical middle where invoice text sits; keep the subject light enough that black text stays fully legible over it.
  - Calm, generous margins.

  STYLE: tasteful, premium Indian-invoice aesthetic; centered composition; muted, harmonious colors true to the theme; a soft brushed halo behind the subject is welcome.

  ORIENTATION: {{ORIENTATION}}.

# Orientation phrase per canvas.
orientation:
  a4: "portrait, taller than wide"
  a5: "landscape, wider than tall"
