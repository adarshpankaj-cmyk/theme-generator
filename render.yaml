# Render Blueprint for the theme-generator Rails backend.
# Frontend is deployed separately on Vercel (see frontend/vercel.json + DEPLOY.md).
#
# One web service runs Puma + Sidekiq together on a persistent disk so the
# background image job and the API share the same Active Storage files.
# Deploy: push this file, then in Render → "New +" → "Blueprint" and pick the repo.

databases:
  - name: theme-generator-db
    databaseName: backend_production
    user: backend
    plan: basic-256mb # bump as needed; free tier expires after 30 days

services:
  # Redis / Key Value store for Sidekiq + Action Cable.
  # NOTE: newer Render UIs label this "Key Value"; the blueprint type stays `redis`.
  - type: redis
    name: theme-generator-redis
    plan: free
    maxmemoryPolicy: noeviction # required by Sidekiq — never evict job data
    ipAllowList: [] # only reachable from services in this Render account

  - type: web
    name: theme-generator-api
    runtime: ruby
    rootDir: backend
    plan: starter # persistent disks require a paid instance type
    buildCommand: bundle install
    preDeployCommand: bundle exec rails db:prepare # create + migrate before traffic
    startCommand: bin/render-start
    healthCheckPath: /up
    disk:
      name: active-storage
      mountPath: /opt/render/project/src/backend/storage # matches Rails.root/storage
      sizeGB: 1
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RACK_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: WEB_CONCURRENCY
        value: "1" # single Puma process — keeps the shared disk on one instance
      - key: DATABASE_URL
        fromDatabase:
          name: theme-generator-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: theme-generator-redis
          property: connectionString
      # --- Secrets: set these in the Render dashboard, do NOT commit them ---
      - key: RAILS_MASTER_KEY
        sync: false # paste the contents of backend/config/master.key
      - key: OPENROUTER_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false # e.g. https://theme-generator.vercel.app
      - key: PUBLISH_API_URL
        sync: false # optional — only if the publish feature is used
      - key: PUBLISH_API_TOKEN
        sync: false # optional
