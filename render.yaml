# Render Blueprint for the theme-generator Rails backend (all free tier).
# Frontend is deployed separately on Vercel (see frontend/vercel.json + DEPLOY.md).
#
# One web service runs Puma + Sidekiq together (backend/bin/render-start).
# Deploy: push this file, then in Render → "New +" → "Blueprint" and pick the repo.
#
# FREE-TIER CAVEATS:
#  - No persistent disk, so Active Storage writes to an EPHEMERAL disk: generated
#    theme images are lost when the instance spins down or redeploys. Fine for
#    testing; upgrade the web service to "starter" + add a disk for persistence.
#  - The web service spins down after ~15 min idle (≈50s cold start on next hit).
#  - The free Postgres database expires 30 days after creation.

databases:
  - name: theme-generator-db
    databaseName: backend_production
    user: backend
    plan: free

services:
  # Redis / Key Value store for Sidekiq + Action Cable.
  # NOTE: newer Render UIs label this "Key Value"; the blueprint type stays `redis`.
  - type: redis
    name: theme-generator-redis
    plan: free
    maxmemoryPolicy: noeviction # required by Sidekiq — never evict job data
    ipAllowList: [] # only reachable from services in this Render account

  - type: web
    name: theme-generator-api
    runtime: ruby
    rootDir: backend # Gemfile lives in backend/, not the repo root
    plan: free
    buildCommand: bundle install
    startCommand: bin/render-start # runs db:prepare, then Sidekiq + Puma
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RACK_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: WEB_CONCURRENCY
        value: "1" # single Puma process (keeps memory + the local disk on one box)
      - key: DATABASE_URL
        fromDatabase:
          name: theme-generator-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: theme-generator-redis
          property: connectionString
      # --- Secrets: set these in the Render dashboard, do NOT commit them ---
      - key: RAILS_MASTER_KEY
        sync: false # paste the contents of backend/config/master.key
      - key: OPENROUTER_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false # e.g. https://theme-generator.vercel.app
      - key: PUBLISH_API_URL
        sync: false # optional — only if the publish feature is used
      - key: PUBLISH_API_TOKEN
        sync: false # optional
